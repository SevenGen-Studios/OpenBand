name: Monitor community research sources and coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * 2"

permissions:
  contents: write

concurrency:
  group: openband-v2-data-writers
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test evidence, association and coverage rules
        run: python -m unittest tests.test_community_coverage_phase2 tests.test_coverage_expansion tests.test_breadth_20261106 -v
      - name: Recheck reviewed sources without overwriting curated records
        run: |
          python -m tools.research_public_sources --refresh --limit 100
          python -m tools.register_community_sources
          python -m tools.community_coverage --baseline research/community-intelligence/phase2-2026-11-02/before
      - name: Commit source diagnostics and coverage inventory
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-coverage-report.json community-coverage-report.md community-coverage-report.csv news-sources.json events-sources.json jobs-sources.json research/community-intelligence/phase2-2026-11-02/source-checks.json research/community-intelligence/phase2-2026-11-02/evidence
          if git diff --cached --quiet; then
            echo "No coverage diagnostics changes to commit"
            exit 0
          fi
          git commit -m "Refresh community coverage and research source diagnostics"
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "Concurrent changes conflict with coverage diagnostics; preserving remote data" >&2
              exit 1
            fi
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to publish coverage diagnostics after 3 attempts" >&2
          exit 1
