name: Audit OpenBand data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - data.json
      - tools/audit_data.py
      - scraper.py
      - run_scraper.py
      - run_scraper_v2.py

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('openband-data-audit-pr-{0}', github.event.pull_request.number) || 'openband-v2-data-writers' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run data audit
        run: |
          python tools/audit_data.py | tee audit-results.txt
          python tools/manual_review_report.py

      - name: Commit audit results
        if: github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update OpenBand audit results"
          file_pattern: audit-results.txt manual-review-report.json
