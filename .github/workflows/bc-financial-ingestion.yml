name: BC financial discovery and review
on:
  workflow_dispatch:
    inputs:
      year:
        description: Fiscal year, e.g. 2025-2026 (blank for all)
        default: ''
      band:
        description: Verified BC ID (blank for all)
        default: ''
      limit:
        description: Maximum documents to process
        default: '20'
      ocr:
        description: Retry using free local OCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bc-financial-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBAND_OCR_ENGINE: tesseract
      OPENBAND_OPENAI_FALLBACK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - uses: actions/cache@v4
        with:
          path: .openband-ocr/british-columbia
          key: bc-financial-v1-${{ github.run_id }}
          restore-keys: bc-financial-v1-
      - name: Discover and stage bounded extraction
        env:
          YEAR: ${{ inputs.year }}
          BAND: ${{ inputs.band }}
          LIMIT: ${{ inputs.limit }}
          OCR: ${{ inputs.ocr }}
        shell: bash
        run: |
          args=()
          if [ -n "$YEAR" ]; then args+=(--year "$YEAR"); fi
          if [ -n "$BAND" ]; then args+=(--band "$BAND"); fi
          if [ "$OCR" = true ]; then args+=(--ocr --retry); fi
          python -m tools.ingest_bc --discover --refresh --parse --audit --limit "$LIMIT" "${args[@]}"
      - run: python -m unittest discover -s tests -p 'test_bc_financial*.py'
      - run: node tests/test_bc_financial_comparisons.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bc-financial-review
          path: |
            bc-financial-index.json
            bc-financial-coverage-report.*
            .openband-ocr/british-columbia/*.json
            .openband-ocr/british-columbia/*.source
