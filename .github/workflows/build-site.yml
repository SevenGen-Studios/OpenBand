name: Build static OpenBand routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - admin/**
      - assets/**
      - data.json
      - news-data.json
      - projects-data.json
      - tools/build_site.py
      - tests/**
      - tools/build_analytics_config.py
      - .github/workflows/build-site.yml

permissions:
  contents: write

concurrency:
  group: openband-v2-site-build-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate permanent pages
        env:
          OPENBAND_GA4_ID: ${{ vars.OPENBAND_GA4_ID }}
          OPENBAND_ANALYTICS_ENDPOINT: ${{ vars.OPENBAND_ANALYTICS_ENDPOINT }}
          OPENBAND_ANALYTICS_ENABLED: ${{ vars.OPENBAND_ANALYTICS_ENABLED || 'true' }}
        run: |
          python tools/build_analytics_config.py
          python tools/build_site.py

      - name: Run site and analytics tests
        run: python -m unittest discover -s tests -v

      - name: Commit generated routes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build permanent OpenBand profile routes"
          file_pattern: assets/analytics-config.js first-nations browse news sitemap.xml robots.txt .nojekyll
