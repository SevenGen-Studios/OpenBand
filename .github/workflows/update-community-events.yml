name: Update Saskatchewan community events

on:
  workflow_dispatch:
    inputs:
      band_id:
        description: "Optional ISC band number; leave blank to scan all communities"
        required: false
        type: string
  schedule:
    - cron: "41 13 * * *"
  push:
    branches: [main]
    paths: ["tools/events_discovery.py"]

permissions:
  contents: write

concurrency:
  group: openband-v2-data-writers
  cancel-in-progress: false

jobs:
  discover-community-events:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preserve current events data
        run: cp events-data.json events-data.before.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install -r requirements.txt

      - name: Test events collector
        run: python -m unittest tests/test_events_discovery.py -v

      - name: Discover community events
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.band_id }}" ]; then
            ARGS+=(--band-id "${{ github.event.inputs.band_id }}")
          fi
          python tools/events_discovery.py "${ARGS[@]}"

      - name: Validate event records
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path

          before = json.loads(Path("events-data.before.json").read_text(encoding="utf-8"))
          after = json.loads(Path("events-data.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("events-sources.json").read_text(encoding="utf-8"))
          band_count = len(json.loads(Path("data.json").read_text(encoding="utf-8"))["bands"])
          events = after.get("events", [])
          required = {"id", "bandId", "communityName", "title", "startDate", "sourceUrl", "sourceName", "confidence"}
          minimum = (date.today() - timedelta(days=30)).isoformat()

          if len(registry.get("communities", [])) != band_count:
              raise SystemExit("Event source registry does not cover every tracked community")
          removed = max(0, len(before.get("events", [])) - len(events))\n          print(f"quality pruning removed {removed} previously indexed candidates")\n          for event in events:
              missing = required - set(event)
              if missing:
                  raise SystemExit(f"Event missing required fields: {event.get('id')} {sorted(missing)}")
              if not str(event["sourceUrl"]).startswith("https://"):
                  raise SystemExit(f"Event lacks HTTPS source: {event.get('id')}")
              if event["startDate"] < minimum:
                  raise SystemExit(f"Expired event was published: {event.get('id')}")
          print(f"validated {len(events)} events across {band_count} tracked communities")
          PY

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Rebuild static pages
        run: python tools/build_site.py

      - name: Remove validation snapshot
        run: rm -f events-data.before.json

      - name: Commit community event updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Saskatchewan community events"
          file_pattern: events-data.json events-sources.json events-review-queue.json events-coverage-report.json first-nations sitemap.xml robots.txt
